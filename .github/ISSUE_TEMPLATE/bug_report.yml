name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or vulnerability details. Use SECURITY.md for security reports."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or revision
      placeholder: tag, release, or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant platform, runtime, and tool versions without sensitive data.
